// Platform-neutral agent tooling for Recaf:
//  - A tool layer exposing Recaf's dissection, editing and scripting capabilities in a model-friendly form
//  - An embedded MCP server publishing those tools to external MCP clients
//  - A Claude powered agent that drives the same tools for automated static analysis
//
// Everything in this module must also compile for Android, where it is built from source by 'recaf-android'.
// That rules out desktop-only JDK APIs (javax.tools, java.awt, java.lang.management, com.sun.*, ...).

apply plugin: 'java-library'

dependencies {
    api project(':recaf-core')
    api(libs.anthropic)
    api(libs.rhino)
    implementation(libs.okhttp)

    testImplementation(testFixtures(project(':recaf-core')))
}

tasks.withType(Test).configureEach {
    // Decompilers and the embedded HTTP server in tests benefit from a little more room than the default.
    maxHeapSize = '2048m'
}

// Command line entry point: ./gradlew :recaf-agent:run --args="app.jar --analyze"
apply plugin: 'application'

application {
    mainClass = 'software.coley.recaf.agent.cli.AgentCli'
}

tasks.named('run') {
    // Resolve the input relative to where gradle was invoked rather than to this module.
    workingDir = rootProject.projectDir
    standardInput = System.in
}
