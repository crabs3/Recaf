apply from: 'source-patches.gradle'

// =====================================================================================================================
// This module is 'recaf-core' (and the platform-neutral 'recaf-agent') compiled for Android.
//
// Nothing is forked: the desktop sources are synced from '../../recaf-core' and '../../recaf-agent' at build time and
// compiled against the Android platform. Three mechanisms adapt them:
//
//   1. Overrides  - Any file under 'src/main/java' whose path matches a desktop source file replaces it.
//                   These are the classes that rely on JDK features Android does not have (Weld, javax.tools, ...).
//   2. Removals   - Desktop-only packages listed in 'desktopOnlySources' are dropped (attach API, launcher, ...).
//   3. Retargeting - Where the gap is inside a dependency, the dependency's bytecode is rewritten at build time
//                   (see 'retargetJar'). 'java.lang.foreign' does not exist on Android, so both the desktop sources
//                   and LL-Java-Zip are moved onto the shim in 'software.coley.recaf.android.foreign'.
// =====================================================================================================================

def desktopCoreDir = file('../../recaf-core')
def desktopAgentDir = file('../../recaf-agent')
def overrideDir = file('src/main/java')
def syncedSourcesDir = layout.buildDirectory.dir('generated/recaf/java')
def generatedConfigDir = layout.buildDirectory.dir('generated/recaf/config')
def generatedResourcesDir = layout.buildDirectory.dir('generated/recaf/resources')
def retargetedLibsDir = layout.buildDirectory.dir('generated/recaf/libs')

def foreignShimPackage = 'software.coley.recaf.android.foreign'

def desktopOnlySources = project.ext.desktopOnlySources

configurations {
    // Holds the unmodified LL-Java-Zip jar which gets relocated onto the foreign-memory shim.
    lljzipOriginal {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // Procyon gets its runtime type lookup redirected, see 'retargetProcyon'.
    procyonOriginal {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // Vineflower gets its lookup of a sentinel class file redirected, see 'retargetVineflower'.
    vineflowerOriginal {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // JvmDowngrader's two artifacts ship overlapping classes. A desktop classpath tolerates that, DEX does not.
    downgraderOriginal {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

android {
    namespace = 'software.coley.recaf.android.core'
    compileSdk = 36

    defaultConfig {
        minSdk = 35
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_22
        targetCompatibility = JavaVersion.VERSION_22
    }

    sourceSets {
        main {
            java.srcDirs = [overrideDir, syncedSourcesDir.get().asFile, generatedConfigDir.get().asFile]
            resources.srcDirs = [new File(desktopCoreDir, 'src/main/resources'),
                                 new File(desktopAgentDir, 'src/main/resources'),
                                 file('src/main/resources'),
                                 generatedResourcesDir.get().asFile]
        }
        // 'sharedTest' holds checks and fixtures used by both the host JVM tests and the on-device tests.
        // The sample fixtures live with the 'recaf-agent' tests so the desktop and Android builds share them.
        test {
            java.srcDirs = [file('src/test/java'), file('src/sharedTest/java')]
            resources.srcDirs = [file('src/test/resources'), new File(desktopAgentDir, 'src/test/resources')]
        }
        androidTest {
            java.srcDirs = [file('src/androidTest/java'), file('src/sharedTest/java')]
            resources.srcDirs = [new File(desktopAgentDir, 'src/test/resources')]
        }
    }

    testOptions {
        unitTests.all {
            it.useJUnitPlatform()
            it.maxHeapSize = '2g'
            it.testLogging {
                events 'passed', 'skipped', 'failed'
                showStandardStreams = true
                exceptionFormat = 'full'
            }
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/**', 'META-INF/*.kotlin_module', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES',
                         'META-INF/*.md', 'META-INF/maven/**', 'META-INF/proguard/**', 'META-INF/native-image/**',
                         'LICENSE*', 'NOTICE*', 'README*', 'module-info.class', '**/module-info.class',
                         'about.html', 'plugin.properties', '**/*.java']
            pickFirsts += ['META-INF/services/**', '**/*.properties', '**/*.txt', '**/*.xml', '**/*.json']
        }
    }
}

