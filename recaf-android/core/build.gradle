// ========================================== SOURCE ASSEMBLY ==========================================

/**
 * @return Paths (relative to a java source root) of all override sources in this module.
 */
def overridePaths = {
    def paths = []
    if (overrideDir.exists()) {
        fileTree(overrideDir) { include '**/*.java' }.visit { details ->
            if (!details.directory) paths.add(details.relativePath.pathString)
        }
    }
    return paths
}

// Copies the desktop sources into the build directory, dropping anything overridden or desktop-only,
// and applying the retargeting rules in 'source-patches.gradle'.
// Files are only rewritten when their content changes so that incremental compilation keeps working.
def syncDesktopSources = tasks.register('syncDesktopSources') {
    description = 'Assembles the recaf-core/recaf-agent sources that get compiled for Android'
    def overrides = overridePaths()
    def sourceRoots = [new File(desktopCoreDir, 'src/main/java'), new File(desktopAgentDir, 'src/main/java')]
    def globalPatches = project.ext.globalSourcePatches
    def filePatches = project.ext.fileSourcePatches
    def outputDir = syncedSourcesDir
    inputs.property('overrides', overrides)
    inputs.property('desktopOnly', desktopOnlySources)
    inputs.property('globalPatches', globalPatches.toString())
    inputs.property('filePatches', filePatches.toString())
    sourceRoots.each { File root -> if (root.exists()) inputs.dir(root) }
    outputs.dir(outputDir)
    doLast {
        File outRoot = outputDir.get().asFile
        Set<String> written = new HashSet<>()
        Set<String> appliedFilePatches = new HashSet<>()
        sourceRoots.findAll { it.exists() }.each { File root ->
            fileTree(root) {
                include '**/*.java'
                exclude desktopOnlySources
                exclude overrides
            }.visit { details ->
                if (details.directory) return
                String path = details.relativePath.pathString
                String text = details.file.getText('UTF-8')
                globalPatches.each { patch -> text = text.replaceAll(patch.pattern, patch.replace) }
                filePatches.findAll { it.file == path }.each { patch ->
                    String patched = patch.containsKey('pattern') ?
                            text.replaceAll(patch.pattern, patch.replace) : text.replace(patch.find, patch.replace)
                    if (patched == text)
                        throw new GradleException("Android source patch no longer applies to ${path}: ${patch.containsKey('pattern') ? patch.pattern : patch.find}")
                    text = patched
                    appliedFilePatches.add(path)
                }
                File target = new File(outRoot, path)
                if (!target.exists() || target.getText('UTF-8') != text) {
                    target.parentFile.mkdirs()
                    target.setText(text, 'UTF-8')
                }
                written.add(path)
            }
        }
        // A patch whose file vanished upstream should be noticed rather than silently skipped.
        filePatches.collect { it.file }.unique().each { String path ->
            if (!appliedFilePatches.contains(path) && !overrides.contains(path))
                throw new GradleException("Android source patch targets a file that is not part of the sync: ${path}")
        }
        // Remove stale outputs.
        fileTree(outRoot) { include '**/*.java' }.visit { details ->
            if (!details.directory && !written.contains(details.relativePath.pathString))
                details.file.delete()
        }
    }
}

// Equivalent of the desktop 'gversion' plugin output.
def generateBuildConfig = tasks.register('generateRecafBuildConfig') {
    def outputDir = generatedConfigDir
    def versionString = project.version.toString()
    def gitSha = providers.exec { commandLine 'git', 'rev-parse', 'HEAD'; ignoreExitValue = true }
            .standardOutput.asText.map { it.trim() }.orElse('unknown')
    def gitRevision = providers.exec { commandLine 'git', 'rev-list', '--count', 'HEAD'; ignoreExitValue = true }
            .standardOutput.asText.map { it.trim() }.orElse('0')
    def gitDate = providers.exec {
        commandLine 'git', 'log', '-1', '--format=%cd', '--date=format:%Y %m/%d %H:%M'; ignoreExitValue = true
    }.standardOutput.asText.map { it.trim() }.orElse('unknown')
    def gitBranch = providers.exec { commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'; ignoreExitValue = true }
            .standardOutput.asText.map { it.trim() }.orElse('unknown')
    inputs.property('version', versionString)
    inputs.property('sha', gitSha)
    outputs.dir(outputDir)
    doLast {
        def revision = gitRevision.get().isInteger() ? gitRevision.get() : '0'
        def file = new File(outputDir.get().asFile, 'software/coley/recaf/RecafBuildConfig.java')
        file.parentFile.mkdirs()
        file.setText("""\
package software.coley.recaf;

/**
 * Automatically generated file containing build version information.
 */
public final class RecafBuildConfig {
	public static final String MAVEN_GROUP = "software.coley";
	public static final String MAVEN_NAME = "recaf-android";
	public static final String VERSION = "${versionString}";
	public static final int GIT_REVISION = ${revision};
	public static final String GIT_SHA = "${gitSha.get()}";
	public static final String GIT_DATE = "${gitDate.get()}";
	public static final String GIT_BRANCH = "${gitBranch.get()}";
	public static final String BUILD_DATE = "${gitDate.get()}";
	public static final long BUILD_UNIX_TIME = 0L;
	public static final int DIRTY = 0;

	private RecafBuildConfig(){}
}
""", 'UTF-8')
    }
}

// Index of CDI bean classes. Android has no classpath scanning, so the reflective container reads this list.
def generateBeanIndex = tasks.register('generateBeanIndex') {
    dependsOn syncDesktopSources
    inputs.dir(overrideDir)
    inputs.dir(syncedSourcesDir)
    outputs.dir(generatedResourcesDir)
    doLast {
        def beanClasses = [] as TreeSet
        [overrideDir, syncedSourcesDir.get().asFile].each { File root ->
            fileTree(root) { include '**/*.java' }.files.each { File sourceFile ->
                String text = sourceFile.getText('UTF-8')
                if (!(text =~ /(?m)^\s*@(ApplicationScoped|Dependent)\b/))
                    return
                def packageMatcher = text =~ /(?m)^package\s+([a-zA-Z0-9_.]+);/
                if (!packageMatcher.find())
                    return
                beanClasses.add(packageMatcher.group(1) + '.' + sourceFile.name[0..-6])
            }
        }
        def outputFile = new File(generatedResourcesDir.get().asFile, 'META-INF/recaf-core-beans.txt')
        outputFile.parentFile.mkdirs()
        outputFile.setText(beanClasses.join('\n') + '\n', 'UTF-8')
    }
}

// ========================================== LIBRARY RETARGETING ==========================================

/**
 * Rewrites a library jar so that it works on Android.
 *
 * @param input Original jar.
 * @param output Rewritten jar.
 * @param rules Map with the optional keys:
 *   'classes'   - Map of internal class name (or package prefix ending in '/') to its replacement.
 *   'calls'     - List of [owner, name, descriptorContains, onlyInClass (nullable), targetOwner, targetName].
 *                 Matching invocations become static calls to the target. For instance calls the receiver
 *                 becomes the first argument of the target.
 *   'drop'      - List of entry names to leave out of the output.
 */
def retargetJar = { File input, File output, Map rules ->
    Map<String, String> classRules = (rules.classes ?: [:]) as Map<String, String>
    List<List<String>> callRules = (rules.calls ?: []) as List<List<String>>
    Set<String> dropped = ((rules.drop ?: []) as List<String>) as Set<String>
    def remapper = new Remapper() {
        @Override
        String map(String internalName) {
            String exact = classRules.get(internalName)
            if (exact != null) return exact
            for (Map.Entry<String, String> rule : classRules.entrySet())
                if (rule.key.endsWith('/') && internalName.startsWith(rule.key))
                    return rule.value + internalName.substring(rule.key.length())
            return internalName
        }
    }
    output.parentFile.mkdirs()
    new JarOutputStream(new FileOutputStream(output)).withCloseable { JarOutputStream jos ->
        new JarFile(input).withCloseable { JarFile jar ->
            jar.entries().each { JarEntry entry ->
                if (entry.directory || entry.name == 'module-info.class' || entry.name.startsWith('META-INF/versions/')
                        || dropped.contains(entry.name))
                    return
                byte[] bytes = jar.getInputStream(entry).bytes
                if (entry.name.endsWith('.class')) {
                    String className = entry.name.substring(0, entry.name.length() - 6)
                    ClassReader reader = new ClassReader(bytes)
                    ClassWriter writer = new ClassWriter(0)
                    // Calls are redirected before names are remapped, so rules are written against the original names.
                    ClassVisitor redirect = new ClassVisitor(Opcodes.ASM9, new ClassRemapper(writer, remapper)) {
                        @Override
                        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
                            return new MethodVisitor(Opcodes.ASM9, mv) {
                                @Override
                                void visitMethodInsn(int opcode, String owner, String mName, String mDesc, boolean itf) {
                                    List<String> rule = callRules.find { r ->
                                        r[0] == owner && r[1] == mName && mDesc.contains(r[2]) && (r[3] == null || r[3] == className)
                                    }
                                    if (rule != null) {
                                        String targetDesc = opcode == Opcodes.INVOKESTATIC ? mDesc : '(L' + owner + ';' + mDesc.substring(1)
                                        super.visitMethodInsn(Opcodes.INVOKESTATIC, rule[4], rule[5], targetDesc, false)
                                    } else {
                                        super.visitMethodInsn(opcode, owner, mName, mDesc, itf)
                                    }
                                }
                            }
                        }
                    }
                    reader.accept(redirect, 0)
                    bytes = writer.toByteArray()
                }
                jos.putNextEntry(new JarEntry(entry.name))
                jos.write(bytes)
                jos.closeEntry()
            }
        }
    }
}

def shimInternal = foreignShimPackage.replace('.', '/')
def compatInternal = 'software/coley/recaf/android/compat'

// LL-Java-Zip models archive content with 'java.lang.foreign' (absent on Android) and has a fast inflater path built on
// JDK internals (also absent). Both are moved onto portable equivalents.
tasks.register('retargetLljzip') {
    def input = configurations.lljzipOriginal
    def output = retargetedLibsDir.map { it.file('lljzip-android.jar') }
    def compression = 'software/coley/lljzip/format/compression/'
    def rules = [
            classes: [
                    'java/lang/foreign/'                          : shimInternal + '/',
                    // The 'unsafe' decompressor pokes at java.util.zip.Inflater internals. The plain one behaves the same.
                    (compression + 'UnsafeDeflateDecompressor'): compression + 'DeflateDecompressor',
            ],
            calls  : [
                    // FileChannel.map(MapMode, long, long, Arena) does not exist on Android.
                    ['java/nio/channels/FileChannel', 'map', 'Ljava/lang/foreign/Arena;', null, 'java/lang/foreign/ForeignSupport', 'map'],
            ],
            drop   : [
                    compression + 'UnsafeDeflateDecompressor.class',
                    compression + 'DeflateEntry.class',
                    'software/coley/lljzip/util/InflaterHackery.class',
                    'software/coley/lljzip/util/UnsafeUtil.class',
            ],
    ]
    inputs.files(input)
    inputs.property('rules', rules.toString())
    outputs.file(output)
    doLast { retargetJar(input.singleFile, output.get().asFile, rules) }
}

// Procyon bootstraps its type system by reading 'java/lang/Object.class' and friends from the system class loader.
// Android has no class files for its runtime, so that lookup is pointed at a loader which synthesizes them.
tasks.register('retargetProcyon') {
    def input = configurations.procyonOriginal
    def output = retargetedLibsDir.map { it.file('procyon-android.jar') }
    def rules = [
            calls: [
                    ['java/lang/ClassLoader', 'getSystemClassLoader', '()', 'com/strobel/assembler/metadata/ClasspathTypeLoader',
                     compatInternal + '/RuntimeResourceLoader', 'get'],
            ],
    ]
    inputs.files(input)
    inputs.property('rules', rules.toString())
    outputs.file(output)
    doLast { retargetJar(input.singleFile, output.get().asFile, rules) }
}

// Vineflower parses its own class file as a placeholder class, and bundles plugins as nested jars of JVM bytecode.
// Android offers class files for neither lookup, and cannot load the plugins (desktop Recaf strips them as well).
tasks.register('retargetVineflower') {
    def input = configurations.vineflowerOriginal
    def output = retargetedLibsDir.map { it.file('vineflower-android.jar') }
    def rules = [
            calls: [
                    ['java/lang/Class', 'getResourceAsStream', '(Ljava/lang/String;)', 'org/jetbrains/java/decompiler/struct/StructContext',
                     compatInternal + '/RuntimeResourceLoader', 'classResource'],
            ],
            drop : [
                    'META-INF/plugins/vineflower-idea-not-null.jar',
                    'META-INF/plugins/vineflower-kotlin-0.1.0.jar',
                    'META-INF/plugins/vineflower-variable-renaming.jar',
            ],
    ]
    inputs.files(input)
    inputs.property('rules', rules.toString())
    outputs.file(output)
    doLast { retargetJar(input.singleFile, output.get().asFile, rules) }
}

// Merges JvmDowngrader's artifacts into a single jar, keeping the first copy of each duplicated entry.
tasks.register('mergeDowngrader') {
    def input = configurations.downgraderOriginal
    def output = retargetedLibsDir.map { it.file('jvmdowngrader-android.jar') }
    inputs.files(input)
    outputs.file(output)
    doLast {
        File outFile = output.get().asFile
        outFile.parentFile.mkdirs()
        Set<String> seen = new HashSet<>()
        new JarOutputStream(new FileOutputStream(outFile)).withCloseable { JarOutputStream jos ->
            // The core artifact goes first so that its copies of the shared classes win.
            input.files.sort { a, b -> a.name.contains('java-api') <=> b.name.contains('java-api') }.each { File file ->
                new JarFile(file).withCloseable { JarFile jar ->
                    jar.entries().each { JarEntry entry ->
                        if (entry.directory || entry.name == 'module-info.class' || entry.name.startsWith('META-INF/versions/')
                                || entry.name.toUpperCase().startsWith('LICENSE') || !seen.add(entry.name))
                            return
                        jos.putNextEntry(new JarEntry(entry.name))
                        jos.write(jar.getInputStream(entry).bytes)
                        jos.closeEntry()
                    }
                }
            }
        }
    }
}

// Some libraries declare JDK-only exception types in method signatures (for instance JvmDowngrader's
// 'throws IllegalClassFormatException'). javac needs such types to exist in order to compile callers, the runtime
// does not. This emits empty stand-ins which are only ever on the compile classpath.
tasks.register('generateCompileOnlyStubs') {
    def output = retargetedLibsDir.map { it.file('jdk-compile-stubs.jar') }
    def stubs = ['java/lang/instrument/IllegalClassFormatException': 'java/lang/Exception']
    inputs.property('stubs', stubs)
    outputs.file(output)
    doLast {
        File outFile = output.get().asFile
        outFile.parentFile.mkdirs()
        new JarOutputStream(new FileOutputStream(outFile)).withCloseable { JarOutputStream jos ->
            stubs.each { String name, String superName ->
                ClassWriter writer = new ClassWriter(ClassWriter.COMPUTE_MAXS)
                writer.visit(Opcodes.V1_8, Opcodes.ACC_PUBLIC | Opcodes.ACC_SUPER, name, null, superName, null)
                ['()V', '(Ljava/lang/String;)V'].each { String descriptor ->
                    MethodVisitor mv = writer.visitMethod(Opcodes.ACC_PUBLIC, '<init>', descriptor, null, null)
                    mv.visitCode()
                    mv.visitVarInsn(Opcodes.ALOAD, 0)
                    if (descriptor.contains('String')) mv.visitVarInsn(Opcodes.ALOAD, 1)
                    mv.visitMethodInsn(Opcodes.INVOKESPECIAL, superName, '<init>', descriptor, false)
                    mv.visitInsn(Opcodes.RETURN)
                    mv.visitMaxs(0, 0)
                    mv.visitEnd()
                }
                writer.visitEnd()
                jos.putNextEntry(new JarEntry(name + '.class'))
                jos.write(writer.toByteArray())
                jos.closeEntry()
            }
        }
    }
}

// ========================================== WIRING ==========================================

tasks.withType(JavaCompile).configureEach {
    dependsOn syncDesktopSources, generateBuildConfig
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters' << '-Xmaxerrs' << '2000' << '-Xmaxwarns' << '0'
}

tasks.configureEach { task ->
    // Anything that consumes java sources or java resources needs the generated inputs in place.
    if (task.name.startsWith('process') && task.name.endsWith('JavaRes'))
        task.dependsOn generateBeanIndex
    if (task.name.contains('Lint') || task.name.endsWith('SourcesJar') || task.name.contains('Kotlin'))
        task.dependsOn syncDesktopSources, generateBuildConfig, generateBeanIndex
}
