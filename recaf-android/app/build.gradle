plugins {
    alias(androidLibs.plugins.android.application)
    alias(androidLibs.plugins.kotlin.compose)
}

// The Recaf Android application: an agent-first user interface on top of ':core'.
android {
    namespace = 'software.coley.recaf.android.app'
    // Newer than ':core' on purpose. The Compose libraries require compiling against API 37, while ':core' stays on
    // API 36 so that the desktop sources keep being checked against the platform surface they have to run on.
    compileSdk = 37

    defaultConfig {
        applicationId = 'software.coley.recaf.android'
        minSdk = 35
        targetSdk = 36
        versionCode = 1
        versionName = project.version.toString()
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            // Recaf and the decompilers it embeds rely on reflection throughout, and the reflective CDI container
            // needs every bean class, constructor and annotation intact. Shrinking is not worth the breakage risk.
            minifyEnabled = false
            // Signed with the debug key so that a release build is installable out of the box.
            // Replace with a real signing config before distributing.
            signingConfig = signingConfigs.debug
        }
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/**', 'META-INF/*.kotlin_module', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES',
                         'META-INF/*.md', 'META-INF/maven/**', 'META-INF/proguard/**', 'META-INF/native-image/**',
                         'LICENSE*', 'NOTICE*', 'README*', 'module-info.class', '**/module-info.class',
                         'about.html', 'plugin.properties', '**/*.java']
            pickFirsts += ['META-INF/services/**', '**/*.properties', '**/*.txt', '**/*.xml', '**/*.json']
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation(project(':core'))

    implementation(platform(androidLibs.compose.bom))
    implementation(androidLibs.compose.ui)
    implementation(androidLibs.compose.ui.tooling.preview)
    implementation(androidLibs.compose.material3)
    implementation(androidLibs.compose.material.icons)
    implementation(androidLibs.activity.compose)
    implementation(androidLibs.lifecycle.viewmodel.compose)
    implementation(androidLibs.lifecycle.runtime.compose)
    implementation(androidLibs.coroutines.android)

    androidTestImplementation('androidx.test:runner:1.7.0')
    androidTestImplementation('androidx.test.ext:junit:1.3.0')
}

// Mirror the exclusions of ':core' for what gets packaged. Only the application's own classpaths are touched:
// applying them to every configuration would also strip annotations the Kotlin compiler needs to run.
configurations.matching { it.name.endsWith('RuntimeClasspath') || it.name.endsWith('CompileClasspath') }.configureEach {
    exclude group: 'org.checkerframework'
    exclude group: 'com.google.code.findbugs'
    exclude group: 'com.google.errorprone'
    exclude group: 'com.google.j2objc'
    exclude group: 'com.ibm.icu'
}
